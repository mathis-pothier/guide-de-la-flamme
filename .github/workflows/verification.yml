# Vérifie la cohérence des données (dont les points ajoutés depuis la carte) à chaque envoi et pull request.
name: Vérification des données

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/validate.mjs
